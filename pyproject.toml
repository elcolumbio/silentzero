[project]
name = "silentzero"
version = "0.1.0"
description = "Gates that tell 'nothing' apart from 'broken' — for pipelines where an empty result and a dead source look the same"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Florian Benkö" }]
keywords = ["data-quality", "pipeline", "health-check", "observability", "etl", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

# No runtime dependencies, deliberately. This is a library you put between your
# data and your output; it has no business dragging a tree in with it. Standard
# library only, SQLite for the run log.
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
silentzero = "silentzero.cli:main"

[project.urls]
Source = "https://github.com/elcolumbio/silentzero"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silentzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
